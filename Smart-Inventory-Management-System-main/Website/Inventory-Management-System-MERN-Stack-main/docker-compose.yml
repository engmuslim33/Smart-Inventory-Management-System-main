services:
  mongo:
    image: mongo:7
    container_name: ims-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ims-net

  auth-service:
    build: ./Backend/auth-service
    image: ims/auth-service:1.0.0
    container_name: ims-auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 4001
      AUTH_MONGO_URI: mongodb://mongo:27017/inventory_auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ims-net

  product-service:
    build: ./Backend/product-service
    image: ims/product-service:1.0.0
    container_name: ims-product
    restart: unless-stopped
    environment:
      PRODUCT_SERVICE_PORT: 4002
      PRODUCT_MONGO_URI: mongodb://mongo:27017/inventory_products
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ims-net

  inventory-service:
    build: ./Backend/inventory-service
    image: ims/inventory-service:1.0.0
    container_name: ims-inventory
    restart: unless-stopped
    environment:
      INVENTORY_SERVICE_PORT: 4004
      INVENTORY_MONGO_URI: mongodb://mongo:27017/inventory_inventory
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ims-net

  order-service:
    build: ./Backend/order-service
    image: ims/order-service:1.0.0
    container_name: ims-order
    restart: unless-stopped
    environment:
      ORDER_SERVICE_PORT: 4003
      ORDER_MONGO_URI: mongodb://mongo:27017/inventory_orders
      INVENTORY_SERVICE_URL: http://inventory-service:4004
    depends_on:
      mongo:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - ims-net

  statistics-service:
    build: ./Backend/statistics-service
    image: ims/statistics-service:1.0.0
    container_name: ims-statistics
    restart: unless-stopped
    environment:
      STATISTICS_SERVICE_PORT: 4005
      STATISTICS_MONGO_URI: mongodb://mongo:27017/inventory_statistics
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      INVENTORY_SERVICE_URL: http://inventory-service:4004
    depends_on:
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - ims-net

  api-gateway:
    build: ./Backend/api-gateway
    image: ims/api-gateway:1.0.0
    container_name: ims-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      INVENTORY_SERVICE_URL: http://inventory-service:4004
      STATISTICS_SERVICE_URL: http://statistics-service:4005
    depends_on:
      - auth-service
      - product-service
      - order-service
      - inventory-service
      - statistics-service
    ports:
      - "4000:4000"
    networks:
      - ims-net

  frontend:
    build: ./Frontend
    image: ims/frontend:1.0.0
    container_name: ims-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - ims-net

volumes:
  mongo-data:

networks:
  ims-net:
    driver: bridge