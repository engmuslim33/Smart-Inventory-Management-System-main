apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: smart-inventory
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ahmedwalid1410/ims-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: PRODUCT_SERVICE_PORT
              value: "4002"
            - name: PRODUCT_MONGO_URI
              value: "mongodb://mongo:27017/inventory_products"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: smart-inventory
spec:
  selector:
    app: product-service
  ports:
    - port: 4002
      targetPort: 4002
  type: ClusterIP
