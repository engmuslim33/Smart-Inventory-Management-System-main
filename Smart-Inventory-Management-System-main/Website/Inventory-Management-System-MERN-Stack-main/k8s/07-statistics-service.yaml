apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
  namespace: smart-inventory
  labels:
    app: statistics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistics-service
  template:
    metadata:
      labels:
        app: statistics-service
    spec:
      containers:
        - name: statistics-service
          image: ahmedwalid1410/ims-statistics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4005
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: STATISTICS_SERVICE_PORT
              value: "4005"
            - name: STATISTICS_MONGO_URI
              value: "mongodb://mongo:27017/inventory_statistics"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:4002"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:4003"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:4004"
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
  namespace: smart-inventory
spec:
  selector:
    app: statistics-service
  ports:
    - port: 4005
      targetPort: 4005
  type: ClusterIP
