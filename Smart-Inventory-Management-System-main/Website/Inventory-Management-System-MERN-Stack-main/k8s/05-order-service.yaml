apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: smart-inventory
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ahmedwalid1410/ims-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: ORDER_SERVICE_PORT
              value: "4003"
            - name: ORDER_MONGO_URI
              value: "mongodb://mongo:27017/inventory_orders"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:4004"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: smart-inventory
spec:
  selector:
    app: order-service
  ports:
    - port: 4003
      targetPort: 4003
  type: ClusterIP
